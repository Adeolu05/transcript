services:
  - type: web
    name: transcriptflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: TranscriptFlow API
      - key: VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://www.usetranscriptflow.com
      - key: CORS_EXTRA_ORIGINS
        value: https://usetranscriptflow.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "86400"
      - key: RATE_LIMIT_CONVERT_REQUESTS
        value: "40"
      - key: RATE_LIMIT_EVENTS_REQUESTS
        value: "2000"
      - key: RATE_LIMIT_DOWNLOAD_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Point at a Render Key Value (Redis) instance so limits are shared across workers
      - key: REDIS_URL
        sync: false
      - key: LOG_HASH_SECRET
        generateValue: true
      # AI summaries: unset = feature hidden
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RATE_LIMIT_SUMMARIZE_REQUESTS
        value: "3"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "10800"
      - key: TRANSCRIPT_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_RAW_TEXT_LENGTH
        value: "500000"
      - key: MAX_TRANSCRIPT_SEGMENTS
        value: "20000"
      # Under /app/data so a Render disk (if attached) can persist cache + temp files
      - key: FILE_STORAGE_DIR
        value: "/app/data/tmp"
      - key: FILE_TTL_HOURS
        value: "1"
      - key: IN_PROCESS_CLEANUP_ENABLED
        value: "true"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "900"
      - key: PREVIEW_CHARS
        value: "1500"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: METRICS_USERNAME
        sync: false
      - key: METRICS_PASSWORD
        sync: false
      - key: CONVERT_MAX_CONCURRENCY
        value: "2"

  # Optional cleanup cron — only effective if FILE_STORAGE_DIR is on a disk
  # shared with the web service. Primary cleanup is in-process on the API.
  - type: cron
    name: transcriptflow-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    region: oregon
    plan: starter
    command: "python -m app.cleanup"
    envVars:
      - key: FILE_TTL_HOURS
        value: "1"
      - key: FILE_STORAGE_DIR
        value: "/app/data/tmp"
